name: Windows, Android, and iOS release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the pubspec version (for example, v1.15.1)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.release.outputs.app_version }}
      asset_version: ${{ steps.release.outputs.asset_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version_name: ${{ steps.release.outputs.version_name }}

    steps:
      - uses: actions/checkout@v4
      - name: Match the release tag to pubspec.yaml
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          app_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' frosthaven_assistant/pubspec.yaml)"
          if [[ ! "$app_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::Expected pubspec version in the form major.minor.patch+build, got '$app_version'."
            exit 1
          fi

          version_name="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[2]}"
          expected_tag="v${version_name}"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "::error::Release tag '$release_tag' must match pubspec version '$expected_tag'."
            exit 1
          fi

          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "asset_version=${version_name}-${build_number}" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

  validate:
    name: Analyze and test
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frosthaven_assistant

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate test mocks
        run: dart run build_runner build
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --concurrency=1

  android:
    name: Build signed Android APK
    needs:
      - prepare
      - validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frosthaven_assistant

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          for variable_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable_name:-}" ]]; then
              missing+=("$variable_name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=release-keystore.jks" \
            > android/key.properties
      - name: Build release APK
        run: flutter build apk --release
      - name: Remove restored signing files
        if: always()
        shell: bash
        run: rm -f android/app/release-keystore.jks android/key.properties
      - name: Name Android release asset
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/x-haven-assistant-android-${{ needs.prepare.outputs.asset_version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: frosthaven_assistant/dist/*.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows ZIP
    needs:
      - prepare
      - validate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frosthaven_assistant

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package complete Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDirectory = "build\windows\x64\runner\Release"
          if (-not (Test-Path -LiteralPath $releaseDirectory -PathType Container)) {
            throw "Windows release directory was not found: $releaseDirectory"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $archivePath = "dist\x-haven-assistant-windows-${{ needs.prepare.outputs.asset_version }}.zip"
          Compress-Archive -Path (Join-Path $releaseDirectory "*") -DestinationPath $archivePath -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: frosthaven_assistant/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build unsigned iOS app ZIP
    needs:
      - prepare
      - validate
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frosthaven_assistant

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS release without code signing
        run: flutter build ios --release --no-codesign
      - name: Package iOS app bundle
        shell: bash
        run: |
          set -euo pipefail

          app_path="build/ios/iphoneos/Runner.app"
          if [[ ! -d "$app_path" ]]; then
            echo "::error::iOS app bundle was not found: $app_path"
            exit 1
          fi

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            "dist/x-haven-assistant-ios-unsigned-${{ needs.prepare.outputs.asset_version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: frosthaven_assistant/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - validate
      - android
      - windows
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG" release-assets/*
            --target "$GITHUB_SHA"
            --title "X-haven Assistant $VERSION_NAME"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh "${release_args[@]}"
