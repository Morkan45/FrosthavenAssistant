name: Mobile smoke build

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frosthaven_assistant

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - name: Build installable test APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: xhaven-android-1.15.1-65
          path: frosthaven_assistant/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned compile check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frosthaven_assistant

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile iOS without code signing
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: xhaven-ios-unsigned-1.15.1-65
          path: frosthaven_assistant/build/ios/iphoneos/Runner.app
          if-no-files-found: error
